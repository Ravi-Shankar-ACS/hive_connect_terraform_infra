metadata:
  id: "CKV2_HIVE_1"
  name: "No security group rule may open PostgreSQL (5432) to 0.0.0.0/0"
  category: "NETWORKING"
definition:
  or:
    - cond_type: attribute
      resource_types:
        - aws_vpc_security_group_ingress_rule
      attribute: cidr_ipv4
      operator: not_equals
      value: "0.0.0.0/0"
    - cond_type: attribute
      resource_types:
        - aws_vpc_security_group_ingress_rule
      attribute: to_port
      operator: not_equals
      value: 5432
